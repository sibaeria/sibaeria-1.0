<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title></title>
<style>
:root{--bg:#0b0d12;--card:rgba(18,22,31,.78);--line:rgba(255,255,255,.13);--txt:#f6f7fb;--muted:#aeb5c4;--accent:#8b7cff;--accent2:#43d9ff;--danger:#ff5575}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--txt)}
body{background-image:linear-gradient(135deg,rgba(5,7,12,.82),rgba(5,7,12,.48)),var(--user-bg);background-size:cover;background-position:center;transition:background-image .35s ease}
button,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer}
.app{height:100dvh;width:100%;max-width:720px;margin:auto;display:flex;flex-direction:column;position:relative;padding:12px;gap:10px}
.topbar{height:52px;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.icon{width:46px;height:46px;border:1px solid var(--line);background:rgba(12,15,22,.72);backdrop-filter:blur(16px);border-radius:15px;font-size:20px;display:grid;place-items:center;box-shadow:0 8px 30px #0003}
.players{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px}
.player{min-height:0;border:1px solid var(--line);border-radius:28px;background:var(--card);backdrop-filter:blur(18px);display:flex;flex-direction:column;justify-content:center;padding:16px;box-shadow:0 20px 60px #0004;position:relative;overflow:hidden}
.player:before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 50% 0%,rgba(139,124,255,.16),transparent 38%);pointer-events:none}
.pname{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.lp{font-size:clamp(48px,13vw,88px);font-weight:800;letter-spacing:-.05em;text-align:center;line-height:1;margin:7px 0 14px;text-shadow:0 5px 30px #0008}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-width:440px;width:100%;margin:auto}
.controls button{height:42px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:750;font-size:15px;transition:.16s transform,.16s background}
.controls button:active,.tool:active{transform:scale(.94);background:rgba(255,255,255,.15)}
.controls .minus{color:#ff8da4}.controls .plus{color:#8cf3ff}
.bottom{height:66px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.tool{border:1px solid var(--line);border-radius:18px;background:rgba(12,15,22,.75);backdrop-filter:blur(16px);font-size:21px;box-shadow:0 8px 30px #0004}
.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal.open{display:flex}.sheet{width:min(700px,100%);max-height:88dvh;background:rgba(17,21,30,.96);border:1px solid var(--line);border-radius:28px;padding:16px;box-shadow:0 30px 100px #000b;animation:up .25s ease}
@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheethead b{font-size:17px}
.close{width:38px;height:38px;border-radius:12px;background:#fff1}.history{overflow:auto;max-height:55dvh;display:flex;flex-direction:column;gap:7px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:13px;background:#fff07;border:1px solid #fff0e}
.row small{color:var(--muted)}.gain{color:#83f0c4}.loss{color:#ff8ba3}
textarea{width:100%;height:55dvh;resize:none;background:#0b0e14;color:var(--txt);border:1px solid var(--line);border-radius:18px;padding:15px;outline:none}
.dice-wrap,.coin-wrap{height:55dvh;display:grid;place-items:center;position:relative;overflow:hidden;border-radius:20px;background:radial-gradient(circle,#242a3c,#0b0e14 65%)}
.die{width:100px;height:100px;background:linear-gradient(145deg,#fff,#cdd4df);border-radius:20px;display:grid;place-items:center;color:#111;font-size:48px;font-weight:900;box-shadow:0 18px 40px #0008;user-select:none}
.die.roll{animation:diceroll .72s cubic-bezier(.2,.8,.25,1)}
.die.settle{animation:diceSettle .34s cubic-bezier(.18,.9,.3,1)}
@keyframes diceSettle{0%{transform:scale(.88) rotate(-3deg);filter:brightness(1.35)}55%{transform:scale(1.08) rotate(1deg);filter:brightness(1.12)}100%{transform:scale(1) rotate(0);filter:brightness(1)}}
@keyframes diceroll{0%{transform:translateY(70px) rotate(0) scale(.65);opacity:.4}25%{transform:translateY(-95px) rotate(150deg) scale(1.05);opacity:1}55%{transform:translateY(28px) rotate(330deg) scale(.9)}78%{transform:translateY(-15px) rotate(500deg) scale(1.02)}100%{transform:translateY(0) rotate(540deg) scale(1)}}
.coin-stage{width:150px;height:170px;display:grid;place-items:center;perspective:900px;position:relative}
.coin-shadow{position:absolute;width:92px;height:18px;bottom:18px;border-radius:50%;background:#0007;filter:blur(8px);transform:scale(.75);opacity:.65;will-change:transform,opacity}
.coin{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;position:relative;
background:radial-gradient(circle at 32% 27%,#fff8cf 0 7%,#f7dd72 20%,#d7a72d 62%,#a87817 100%);
border:5px solid #f6dc73;color:#654700;font-size:22px;font-weight:900;
box-shadow:inset 0 2px 4px #fff8,inset 0 -7px 12px #80580066,0 18px 35px #0008;
transform-style:preserve-3d;will-change:transform;backface-visibility:hidden;
-webkit-backface-visibility:hidden;contain:layout paint}
.coin::before{content:"";position:absolute;inset:8px;border-radius:50%;border:2px solid #fff6;box-shadow:inset 0 0 0 2px #8c641c55}
.coin::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid #d5a62d;transform:translateZ(-1px)}
.coin.flip{animation:coinToss 1.15s cubic-bezier(.12,.72,.18,1) both}
.coin.coin-settle{animation:coinSettle .3s cubic-bezier(.18,.9,.3,1) both}
@keyframes coinSettle{0%{transform:scale(.92);filter:brightness(1.35)}60%{transform:scale(1.045);filter:brightness(1.08)}100%{transform:scale(1);filter:brightness(1)}}
.coin.flip + .coin-shadow{animation:shadowToss 1.15s cubic-bezier(.12,.72,.18,1) both}
@keyframes coinToss{
0%{transform:translate3d(0,92px,0) rotateX(0deg) rotateZ(-7deg) scale(.72)}
10%{transform:translate3d(-8px,35px,0) rotateX(240deg) rotateZ(-5deg) scale(.88)}
25%{transform:translate3d(5px,-48px,0) rotateX(720deg) rotateZ(5deg) scale(1.02)}
43%{transform:translate3d(-4px,-82px,0) rotateX(1260deg) rotateZ(-4deg) scale(1.06)}
61%{transform:translate3d(3px,-45px,0) rotateX(1800deg) rotateZ(3deg) scale(1.01)}
76%{transform:translate3d(-2px,-10px,0) rotateX(2220deg) rotateZ(-2deg) scale(.98)}
90%{transform:translate3d(1px,4px,0) rotateX(2520deg) rotateZ(1deg) scale(1.01)}
100%{transform:translate3d(0,0,0) rotateX(2700deg) rotateZ(0deg) scale(1)}
}
@keyframes shadowToss{
0%{transform:scale(.55);opacity:.18}
25%{transform:scale(.72);opacity:.34}
43%{transform:scale(.45);opacity:.15}
61%{transform:scale(.64);opacity:.28}
76%{transform:scale(.88);opacity:.5}
90%{transform:scale(1.02);opacity:.68}
100%{transform:scale(1);opacity:.62}
}
.hint{position:absolute;bottom:16px;color:#8891a2;font-size:12px;text-align:center;width:100%}
input[type=file]{display:none}
@media(max-height:680px){.app{padding:8px;gap:7px}.topbar{height:44px}.icon{width:40px;height:40px}.bottom{height:56px}.player{border-radius:22px}.lp{margin:4px 0 8px}.controls button{height:36px}.reset{top:50%}}
.lp-adjust{display:grid;grid-template-columns:58px minmax(0,1fr) 58px;gap:7px;max-width:440px;width:100%;margin:auto}
.lp-op{height:42px;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:800;font-size:24px;line-height:1;transition:.16s transform,.16s background,.16s box-shadow}
.lp-op.minus{color:#ff8da4}.lp-op.plus{color:#8cf3ff}
.lp-op:active,.lp-op.selected{transform:scale(.94);background:rgba(255,255,255,.15);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.lp-amount{height:42px;width:100%;border-radius:13px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);text-align:center;outline:none;font-weight:750;font-size:15px;transition:.16s border-color,.16s box-shadow}
.lp-amount::placeholder{color:var(--muted)}
.lp-amount:focus{border-color:rgba(139,124,255,.55);box-shadow:0 0 0 3px rgba(139,124,255,.10)}
.lp-amount::-webkit-outer-spin-button,.lp-amount::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lp-amount[type=number]{-moz-appearance:textfield}
body,.app,.player,.bottom,.tool,.icon{touch-action:manipulation}
.die{transform-style:preserve-3d;will-change:transform,filter}
.die.roll{animation:dicerollPlus .78s cubic-bezier(.16,.84,.24,1)}
.die.settle{animation:diceSettle .32s cubic-bezier(.2,.9,.25,1)}
@keyframes dicerollPlus{
  0%{transform:translate3d(0,80px,0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(.55);opacity:.15;filter:blur(5px)}
  14%{transform:translate3d(-35px,-55px,0) rotateX(145deg) rotateY(105deg) rotateZ(80deg) scale(.9);opacity:1;filter:blur(0)}
  31%{transform:translate3d(38px,-110px,0) rotateX(330deg) rotateY(255deg) rotateZ(175deg) scale(1.12)}
  49%{transform:translate3d(-28px,-10px,0) rotateX(555deg) rotateY(430deg) rotateZ(285deg) scale(.92)}
  67%{transform:translate3d(24px,-42px,0) rotateX(760deg) rotateY(610deg) rotateZ(405deg) scale(1.04)}
  84%{transform:translate3d(-8px,8px,0) rotateX(930deg) rotateY(760deg) rotateZ(500deg) scale(.98)}
  100%{transform:translate3d(0,0,0) rotateX(1080deg) rotateY(900deg) rotateZ(540deg) scale(1);opacity:1;filter:blur(0)}
}
@keyframes diceSettle{
  0%{transform:scale(1.08) rotateZ(-2deg)}
  45%{transform:scale(.96) rotateZ(1deg)}
  100%{transform:scale(1) rotateZ(0)}
}
.coin.flip{animation:coinTossPlus 1.18s cubic-bezier(.12,.72,.18,1) both}
@keyframes coinTossPlus{
  0%{transform:translate3d(0,92px,0) rotateX(0deg) rotateY(0deg) rotateZ(-7deg) scale(.68)}
  9%{transform:translate3d(-12px,34px,0) rotateX(390deg) rotateY(55deg) rotateZ(-9deg) scale(.84)}
  23%{transform:translate3d(9px,-52px,0) rotateX(990deg) rotateY(125deg) rotateZ(7deg) scale(1.02)}
  40%{transform:translate3d(-7px,-88px,0) rotateX(1710deg) rotateY(210deg) rotateZ(-6deg) scale(1.09)}
  58%{transform:translate3d(5px,-48px,0) rotateX(2460deg) rotateY(285deg) rotateZ(5deg) scale(1.04)}
  74%{transform:translate3d(-3px,-12px,0) rotateX(3060deg) rotateY(350deg) rotateZ(-3deg) scale(.98)}
  90%{transform:translate3d(1px,3px,0) rotateX(3420deg) rotateY(390deg) rotateZ(1deg) scale(1.015)}
  100%{transform:translate3d(0,0,0) rotateX(3600deg) rotateY(420deg) rotateZ(0deg) scale(1)}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="icon" id="bgBtn" aria-label="Sfondo">▧</button>
    <input id="bgInput" type="file" accept="image/*">
    <button class="icon" id="resetBtn" aria-label="Nuova partita">↻</button>
  </div>
  <main class="players">
    <section class="player">
      <div class="pname">PLAYER 1</div><div class="lp" id="lp1">8000</div>
      <div class="controls" role="group" aria-label="Modifica Life Points giocatore 1">
        <button class="minus lp-op selected" type="button" data-p="1" data-sign="-1" aria-label="Sottrai">−</button>
        <input class="lp-amount" id="amount1" type="number" inputmode="numeric" min="0" step="1" placeholder="Cifra" aria-label="Cifra Life Points giocatore 1">
        <button class="plus lp-op" type="button" data-p="1" data-sign="1" aria-label="Aggiungi">+</button>
      </div>
    </section>
    <section class="player">
      <div class="pname">PLAYER 2</div><div class="lp" id="lp2">8000</div>
      <div class="controls" role="group" aria-label="Modifica Life Points giocatore 2">
        <button class="minus lp-op selected" type="button" data-p="2" data-sign="-1" aria-label="Sottrai">−</button>
        <input class="lp-amount" id="amount2" type="number" inputmode="numeric" min="0" step="1" placeholder="Cifra" aria-label="Cifra Life Points giocatore 2">
        <button class="plus lp-op" type="button" data-p="2" data-sign="1" aria-label="Aggiungi">+</button>
      </div>
    </section>
  </main>
  <nav class="bottom">
    <button class="tool" id="diceBtn" title="Dado">⚄</button>
    <button class="tool" id="coinBtn" title="Moneta">◉</button>
    <button class="tool" id="historyBtn" title="Storico">☷</button>
    <button class="tool" id="notesBtn" title="Appunti">✎</button>
  </nav>
</div>

<div class="modal" id="modal"><div class="sheet">
  <div class="sheethead"><b id="modalTitle"></b><button class="close" id="close">×</button></div>
  <div id="modalBody"></div>
</div></div>

<script>
const state={lp:[8000,8000],history:[],notes:"",bg:localStorage.getItem("ygo-bg")||""};
const $=s=>document.querySelector(s), modal=$("#modal"), body=$("#modalBody"), title=$("#modalTitle");
function save(){localStorage.setItem("ygo-state",JSON.stringify(state))}
const old=JSON.parse(localStorage.getItem("ygo-state")||"null"); if(old){state.lp=old.lp||state.lp;state.history=old.history||[];state.notes=old.notes||""}
if(state.bg)document.body.style.setProperty("--user-bg",`url("${state.bg}")`);
function render(){state.lp.forEach((v,i)=>$("#lp"+(i+1)).textContent=v.toLocaleString("it-IT"));save()}
function change(p,n){const before=state.lp[p-1];state.lp[p-1]=Math.max(0,before+n);state.history.unshift({time:new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}),p,n,before,after:state.lp[p-1]});render()}
function applyAmount(p,sign){
  const input=$("#amount"+p), value=Number(input.value);
  if(!Number.isFinite(value)||value<0||!Number.isInteger(value))return;
  if(value===0){input.value="";return}
  change(p,sign*value); input.value="";
  input.focus({preventScroll:true});
}
document.querySelectorAll(".lp-op").forEach(b=>b.onclick=()=>{
  const p=+b.dataset.p, sign=+b.dataset.sign, wrap=b.parentElement;
  wrap.querySelectorAll(".lp-op").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  applyAmount(p,sign);
});
document.querySelectorAll(".lp-amount").forEach(input=>input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const wrap=input.parentElement, b=wrap.querySelector(".lp-op.selected")||wrap.querySelector(".minus");
    applyAmount(+b.dataset.p,+b.dataset.sign);
  }
}));

function open(t,content){title.textContent=t;body.innerHTML=content;modal.classList.add("open")}
function close(){modal.classList.remove("open");body.innerHTML=""}
$("#close").onclick=close; modal.onclick=e=>{if(e.target===modal)close()};
$("#historyBtn").onclick=()=>open("Storico",state.history.length?`<div class="history">${state.history.map(x=>`<div class="row"><small>${x.time} · P${x.p}</small><span class="${x.n>=0?"gain":"loss"}">${x.n>=0?"+":""}${x.n.toLocaleString("it-IT")} → ${x.after.toLocaleString("it-IT")}</span></div>`).join("")}</div>`:`<div class="hint" style="position:relative;bottom:auto;padding:40px 0">Nessuna modifica</div>`);
$("#notesBtn").onclick=()=>{open("Appunti",`<textarea id="notes">${state.notes.replaceAll("&","&amp;").replaceAll("<","&lt;")}</textarea>`);const n=$("#notes");n.oninput=()=>{state.notes=n.value;save()}};
let dieVal=1,coinVal="TESTA",coinBusy=false;
function secureRandomInt(max){
  if(window.crypto&&crypto.getRandomValues){
    const limit=Math.floor(0x100000000/max)*max;
    const a=new Uint32Array(1);
    do{crypto.getRandomValues(a)}while(a[0]>=limit);
    return a[0]%max;
  }
  return Math.floor(Math.random()*max);
}
function secureDie(){return 1+secureRandomInt(6)}
function secureCoin(){return secureRandomInt(2)===0?"TESTA":"CROCE"}
function secureRandomInt(max){
  if(window.crypto&&crypto.getRandomValues){
    const limit=Math.floor(0x100000000/max)*max;
    const a=new Uint32Array(1);
    do{crypto.getRandomValues(a)}while(a[0]>=limit);
    return a[0]%max;
  }
  return Math.floor(Math.random()*max);
}
function secureDie(){return 1+secureRandomInt(6)}
function secureCoin(){return secureRandomInt(2)===0?"TESTA":"CROCE"}
$("#diceBtn").onclick=()=>{
  open("Dado",`<div class="dice-wrap"><div class="die" id="die">${dieVal}</div><div class="hint">Tocca il dado per rilanciare</div></div>`);
  rollDie();
};
function rollDie(){
  const d=$("#die");
  if(!d)return;
  dieVal=secureDie();
  d.classList.remove("roll","settle");
  void d.offsetWidth;
  d.textContent="•";
  d.classList.add("roll");
  const started=performance.now(),duration=780;
  const tick=now=>{
    if(!d.isConnected)return;
    if(now-started<duration){
      d.textContent=String(secureDie());
      requestAnimationFrame(tick);
    }else{
      d.textContent=String(dieVal);
      d.classList.remove("roll");
      void d.offsetWidth;
      d.classList.add("settle");
    }
  };
  requestAnimationFrame(tick);
}

$("#coinBtn").onclick=()=>{
  open("Moneta",`<div class="coin-wrap"><div class="coin-stage"><div class="coin-shadow"></div><div class="coin" id="coin">•</div></div><div class="hint">Tocca la moneta per rilanciarla</div></div>`);
  flipCoin();
};
function flipCoin(){
  const c=$("#coin");
  if(!c || coinBusy)return;
  coinBusy=true;
  coinVal=secureCoin();
  c.classList.remove("flip");
  c.textContent="•";
  void c.offsetWidth;
  c.classList.add("flip");
  c.addEventListener("animationend",()=>{
    c.textContent=coinVal;
    c.classList.remove("flip");
    coinBusy=false;
  },{once:true});
}

body.addEventListener("click",e=>{
  if(e.target.id==="die")rollDie();
  if(e.target.id==="coin")flipCoin();
});
$("#bgBtn").onclick=()=>$("#bgInput").click();
$("#bgInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.bg=r.result;document.body.style.setProperty("--user-bg",`url("${r.result}")`);save()};r.readAsDataURL(f)};
function newGame(){
  state.lp=[8000,8000];
  state.history=[];
  state.notes="";
  render();
  close();
}
$("#resetBtn").onclick=()=>newGame();
let lastTouch=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouch<320)e.preventDefault();
  lastTouch=now;
},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(type=>document.addEventListener(type,e=>e.preventDefault(),{passive:false}));
render();
</script>
</body>
</html>
